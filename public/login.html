<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 云曲线喷涂数据平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#1a73e8 0%,#0d47a1 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:400px;padding:40px 36px}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:22px;color:#1a73e8;font-weight:700;margin-bottom:6px}
.logo p{font-size:13px;color:#888}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;color:#555;margin-bottom:6px;font-weight:500}
.form-group input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:border .2s}
.form-group input:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.1)}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:6px}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(26,115,232,.4)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error-msg{background:#fee;color:#c33;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px;display:none}
.error-msg.show{display:block}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#aaa}
</style>
<script src="/auth.js"></script>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <h1>云曲线喷涂数据平台</h1>
    <p>CURVEROBOT Data Platform</p>
  </div>
  <div class="error-msg" id="errorMsg"></div>
  <form id="loginForm" onsubmit="doLogin(event)">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">登 录</button>
  </form>
  <div class="footer">云曲线（台州）机器人有限公司</div>
</div>
<script>
function showError(msg){
  const el=document.getElementById('errorMsg');
  el.textContent=msg;el.classList.add('show');
}
async function doLogin(e){
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.textContent='登录中...';
  document.getElementById('errorMsg').classList.remove('show');
  try{
    const res=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username:document.getElementById('username').value.trim(),
        password:document.getElementById('password').value
      })
    });
    const data=await res.json();
    if(!res.ok){showError(data.error||'登录失败');btn.disabled=false;btn.textContent='登 录';return;}
    // 使用 Auth 模块存储 token（同时记录活动时间，30分钟无操作自动登出）
    Auth.setAuth(data.token, data.user);
    // 管理员跳管理后台，子账号跳看板
    if(data.user.role==='admin') location.href='/admin';
    else location.href='/dashboard';
  }catch(err){
    showError('网络错误，请重试');
    btn.disabled=false;btn.textContent='登 录';
  }
}
// 已登录且未过期则自动跳转
(function(){
  if(Auth.getToken() && !Auth.isExpired()){
    Auth.fetchAuth('/api/me')
      .then(r=>r.json())
      .then(d=>{location.href=d.user.role==='admin'?'/admin':'/dashboard';})
      .catch(()=>{Auth.clearAuth();});
  }else{
    Auth.clearAuth();
  }
})();
</script>
</body>
</html>
